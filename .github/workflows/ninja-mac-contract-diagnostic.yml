name: macOS tool-option contract diagnostic

on:
  push:
    branches:
      - ln-cx/ninja-2689-mac-contract-20260927

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 106de6fee720f7bb0d43c2da76e586323fac86ac
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: c81da563bab87bf3b1252532ab353100ad4a76f6
          path: fixed
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build both exact Ninja revisions
        run: |
          cmake -S baseline -B baseline-build -DBUILD_TESTING=OFF -DNINJA_BUILD_BINARY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build baseline-build --target ninja --parallel
          cmake -S fixed -B fixed-build -DBUILD_TESTING=OFF -DNINJA_BUILD_BINARY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build fixed-build --target ninja --parallel
      - name: Capture four tool-option orderings
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          expected = {
              'control': os.environ['GITHUB_SHA'],
              'baseline': '106de6fee720f7bb0d43c2da76e586323fac86ac',
              'fixed': 'c81da563bab87bf3b1252532ab353100ad4a76f6',
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=name, text=True).strip()
              if actual != sha:
                  raise RuntimeError(f'{name} checkout SHA mismatch')

          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def test_module(name):
              path = Path(name) / 'misc/output_test.py'
              spec = importlib.util.spec_from_file_location(f'{name}_output_test', path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          baseline_test = test_module('baseline')
          fixed_test = test_module('fixed')
          fixture = baseline_test.ToolTargets.BUILD_WITH_DEPS
          if fixture != fixed_test.ToolTargets.BUILD_WITH_DEPS:
              raise RuntimeError('The two revisions have different fixtures')
          if digest('baseline/misc/output_test.py') != digest('fixed/misc/output_test.py'):
              raise RuntimeError('The two revisions have different test files')

          print('runner_os=' + os.environ['RUNNER_OS'])
          print('runner_arch=' + os.environ['RUNNER_ARCH'])
          print('run_id=' + os.environ['GITHUB_RUN_ID'])
          for name in ('control', 'baseline', 'fixed'):
              print(name + '_head=' + expected[name])
          for path in (
              'control/.github/workflows/ninja-mac-contract-diagnostic.yml',
              'baseline/misc/output_test.py', 'fixed/misc/output_test.py',
              'baseline/src/ninja.cc', 'fixed/src/ninja.cc',
              'baseline/src/getopt.c', 'fixed/src/getopt.c',
              'baseline-build/ninja', 'fixed-build/ninja',
          ):
              print(path + ' sha256=' + digest(path))

          cases = (
              ('option_first', ['-t', 'commands', '-s', 'foo.o']),
              ('tool_target_then_option', ['-t', 'commands', 'foo.o', '-s']),
              ('leading_target_then_option', ['foo.o', '-t', 'commands', '-s']),
              ('leading_target_plain', ['foo.o', '-t', 'commands']),
          )
          env = baseline_test.default_env.copy()
          env.pop('POSIXLY_CORRECT', None)
          with tempfile.TemporaryDirectory() as temporary:
              Path(temporary, 'build.ninja').write_text(fixture)
              for name in ('baseline', 'fixed'):
                  binary = str(Path(f'{name}-build/ninja').resolve())
                  for case, args in cases:
                      result = subprocess.run(
                          [binary, *args], cwd=temporary, env=env,
                          stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                      print('CASE_JSON=' + json.dumps({
                          'revision': name, 'case': case, 'args': args,
                          'returncode': result.returncode,
                          'stdout': result.stdout, 'stderr': result.stderr,
                      }, sort_keys=True))
          PY
